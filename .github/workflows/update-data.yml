name: Refresh medication sources
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: medication-source-import
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.MEDCHECK_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MEDCHECK_URL: ${{ secrets.MEDCHECK_URL }}
      MEDCHECK_IMPORT_TOKEN: ${{ secrets.MEDCHECK_IMPORT_TOKEN }}
      SITES_AUTHORIZATION: ${{ secrets.SITES_AUTHORIZATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify configuration
        run: |
          test -n "$MEDCHECK_URL" && test -n "$MEDCHECK_IMPORT_TOKEN" || { echo 'Configure the deployment URL and import secret before enabling this schedule.'; exit 1; }
      - name: Validate the installation destination before downloading
        run: python -c "import os,sys; sys.path.insert(0,'scripts'); from import_canada import validate_target; validate_target(os.environ['MEDCHECK_URL'],os.environ['MEDCHECK_IMPORT_TOKEN'])"
      - name: Test source parsing and date handling
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Restore public source downloads
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/canada/extract_extrait.zip
            work/canada/extract_extrait.metadata.json
            work/dpd/*.json
          key: medcheck-public-sources-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: medcheck-public-sources-v1-${{ runner.os }}-
      - name: Audit storage and reclaim abandoned staging work
        id: maintenance
        run: python scripts/maintain_storage.py --apply
      - name: Refresh the complete Canadian human product catalogue
        id: catalogue
        continue-on-error: true
        run: python scripts/import_products.py --upload
      - name: Import complete published Canadian reports
        id: reports
        continue-on-error: true
        run: python scripts/import_canada.py --upload
      - name: Refresh previously indexed US labels
        id: labels
        continue-on-error: true
        run: python scripts/import_canada.py --refresh-only
      - name: Preserve only public download cache
        if: always() && steps.source-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            work/canada/extract_extrait.zip
            work/canada/extract_extrait.metadata.json
            work/dpd/*.json
          key: ${{ steps.source-cache.outputs.cache-primary-key }}
      - name: Summarize every source outcome
        if: always()
        env:
          STEP_MAINTENANCE: ${{ steps.maintenance.outcome }}
          STEP_DPD: ${{ steps.catalogue.outcome }}
          STEP_CV: ${{ steps.reports.outcome }}
          STEP_DAILYMED: ${{ steps.labels.outcome }}
        run: python scripts/update_summary.py
      - name: Report incomplete updates
        if: always() && (steps.maintenance.outcome == 'failure' || steps.catalogue.outcome == 'failure' || steps.reports.outcome == 'failure' || steps.labels.outcome == 'failure')
        run: |
          echo 'At least one source update failed. Check the step logs; previously imported data is retained.'
          exit 1
